name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned PHP 8.5 runtime
        run: bin/build
      - name: Install locked dependencies
        run: bin/app composer install --no-interaction --prefer-dist
      - name: Initialize local configuration
        run: |
          cp .env.example .env
          bin/app php artisan key:generate --force
      - name: Verify development acceptance
        run: bin/verify
      - name: Test fresh SQLite setup
        run: |
          touch database/ci.sqlite
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/app" -w /app -e DB_DATABASE=/app/database/ci.sqlite coin-bot-php:8.5 php artisan migrate --force
  native-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v4
      - name: Build complete deployment package
        run: bin/release "$RUNNER_TEMP/coin-bot-release"
      - name: Verify native Debian installation
        run: bin/verify-native-install "$RUNNER_TEMP/coin-bot-release/coin-bot-full-$(git rev-parse --short=7 HEAD).zip" "debian:${{ matrix.suite }}-slim"
