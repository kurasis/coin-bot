# Dedicated host, direct HTTPS ingress; certificate provisioned with DNS-01.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/coin-bot/fullchain.pem;
    ssl_certificate_key /etc/ssl/coin-bot/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/coin-bot/public;
    index index.php;
    include /etc/nginx/snippets/coin-bot-telegram-only.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/coin-bot.sock;
    }

    location ~ \.php$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
