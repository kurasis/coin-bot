# Managed by sudo coin-bot backup:local. Off-host mode keeps the strict base unit.
[Unit]
RequiresMountsFor=
RequiresMountsFor=/home/www/coinbot /var/lib/coin-bot
AssertPathIsMountPoint=

[Service]
ReadWritePaths=
ReadWritePaths=/var/lib/coin-bot /home/www/coinbot/storage /home/www/coinbot/bootstrap/cache
